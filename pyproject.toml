[project]
name = "groww-chatbot"
version = "0.1.0"
description = "Facts-only FAQ assistant for 7 HDFC Mutual Fund schemes, built as a small RAG service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "groq",
    "sentence-transformers",
    "chromadb",
    "rank-bm25",
    "rapidfuzz",
    "httpx>=0.27",
    "trafilatura",
    "beautifulsoup4",
    "pysbd",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "slowapi",
    "pyyaml>=6.0",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Code sketches in the design docs are illustrations, not project code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
