# Phase 4C validator set (eval.md §9.1). Run with: python -m eval.run_validator
#
# Hand-written model outputs, each paired with the source chunk it cites. All text is made up.
#   source:    the cited chunk's text (its id is "c1"; a second chunk "c2" is also given)
#   as_of:     the cited document's as-of date (metadata, not chunk text)
#   question:  optional; numbers the user wrote count as grounded
#   source_id: optional; defaults to "c1"
#   expect:    pass, or the list of checks that must fail
#
# EV-4C-01: no bad output accepted. EV-4C-02: at most 5% of good outputs rejected.

