# Phase 4B retrieval set (eval.md §8). Run with: python -m eval.run_retrieval
#
# Each answerable case names its scope (`scheme`, or null for the statement pages) and the gold
# passages that answer it. A case passes Recall@5 when any top-5 chunk matches any gold entry:
#   fact:<scheme>:<field>          the fact card (exact chunk id)
#   {doc: <doc_id>, section: <s>}  a chunk of that document whose section contains <s>
#   {doc: <doc_id>, text: <t>}     a chunk of that document whose text contains <t>
# Matches ignore case. Gold entries name sections and short key phrases only, never fact values,
# so the set doesn't go stale when a value changes. Fields come from detect_fields(question),
# as in the pipeline.
#
# Off-topic cases have no gold; they should fall below MIN_SIMILARITY (EV-4B-05).

