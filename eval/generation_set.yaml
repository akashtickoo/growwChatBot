# Phase 4C generation set (eval.md §9.2). Run with: python -m eval.run_generation
#
# Each question is given its gold passages directly (retrieval held fixed) and run through the
# real LLM client, prompt, validator and retry with production settings.
#   label: scheme_id:field in eval/fact_labels.yaml; its `accept` values decide correctness
#   also_accept: extra accepted phrasings (e.g. for "no lock-in")
#   expect_type: answer (default) or not_found
#   gold: passages, in the same format as eval/retrieval_set.yaml
# Cases without a label only check the response type, format and grounding.

cases:
  - q: "What is the expense ratio of HDFC Large Cap Fund?"
    scheme: hdfc-large-cap
    label: hdfc-large-cap:expense_ratio
    gold: [fact:hdfc-large-cap:expense_ratio, {doc: hdfc-large-cap-page, section: Key facts}]
  - q: "Is there an exit load on HDFC Large Cap Fund?"
    scheme: hdfc-large-cap
    label: hdfc-large-cap:exit_load
    gold: [fact:hdfc-large-cap:exit_load, {doc: hdfc-large-cap-page, section: Key facts}, {doc: hdfc-large-cap-page, section: Exit Load}]
  - q: "What is the minimum SIP amount for HDFC Large Cap Fund?"
    scheme: hdfc-large-cap
    label: hdfc-large-cap:min_sip
    gold: [fact:hdfc-large-cap:min_sip, {doc: hdfc-large-cap-page, section: Key facts}]
  - q: "What is the minimum application amount for HDFC Large Cap Fund?"
    scheme: hdfc-large-cap
    label: hdfc-large-cap:min_lumpsum
    gold: [fact:hdfc-large-cap:min_lumpsum, {doc: hdfc-large-cap-page, section: Key facts}, {doc: hdfc-large-cap-kim, section: Minimum Application Amount}]
  - q: "Does HDFC Large Cap Fund have a lock-in period?"
    scheme: hdfc-large-cap
    label: hdfc-large-cap:lock_in
    also_accept: ["no lock", "not have a lock", "not applicable", "nil", "does not have"]
